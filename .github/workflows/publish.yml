name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($RELEASE_TAG) must match package.json version ($PACKAGE_VERSION). Expected $EXPECTED_TAG."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify published binary smoke
        run: NIGHTOWL_RUN_PACKAGE_BIN=1 node --test test/cli/package-bin.test.ts

      - name: Publish package
        run: npm publish --access public
